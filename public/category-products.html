<body class="bg-white text-background-dark transition-colors duration-300">
    <!-- Top navigation and header loaded dynamically via component-loader.js -->
    <main class="pt-[120px] max-w-[1440px] mx-auto px-6 lg:px-20 py-8">
        <!-- Line Hero Section -->
        <section id="line-hero"
            class="relative mb-12 rounded-xl overflow-hidden bg-zinc-900 aspect-[21/6] md:aspect-[21/4]">
            <div class="absolute inset-0 bg-cover bg-center opacity-40 mix-blend-overlay" id="line-hero-bg"></div>

            <div class="relative h-full flex flex-col justify-center px-12 max-w-2xl">
                <div
                    class="mb-4 inline-flex items-center gap-2 px-3 py-1 rounded-full bg-primary/20 text-primary text-xs font-bold uppercase tracking-widest">
                    <span class="material-symbols-outlined text-xs">category</span> <span id="category-badge"></span>
                </div>
                <h1 class="text-4xl md:text-5xl font-black text-white mb-4 tracking-tight uppercase" id="category-name"></h1>

                    Scopri tutti i prodotti di questa categoria premium.
                </p>
            </div>
        </section>
        <!-- Breadcrumbs -->
        <div class="flex flex-wrap gap-2 py-4 mb-4">
            <a class="text-zinc-500 text-sm font-medium hover:text-primary transition-colors" href="/">Home</a>
            <span class="text-zinc-500 text-sm">/</span>
            <a class="text-zinc-500 text-sm font-medium hover:text-primary transition-colors"
                href="/liquidi">Prodotti</a>
            <span class="text-zinc-500 text-sm">/</span>
            <span class="text-white text-sm font-medium uppercase" id="breadcrumb-category"></span>
        </div>

        <!-- Line Gallery Section (hidden by default) -->
        <div id="line-gallery" class="hidden mb-12">
            <h2 class="text-2xl font-bold mb-6 text-charcoal dark:text-white uppercase tracking-wider">Galleria Immagini
            </h2>
            <div id="line-gallery-container"
                class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4">
                <!-- Gallery images will be injected here -->
            </div>
        </div>

        <div class="flex-1">
            <div class="flex items-center justify-between mb-6">
                <p class="text-sm text-zinc-500 font-medium">Mostrando <span id="products-count"
                        class="text-white">0</span> prodotti</p>
            </div>
            <div id="products-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
                <!-- Products will be loaded dynamically -->
            </div>
            <div id="no-results" class="hidden text-center py-12">
                <p class="text-zinc-400 text-lg">Nessun prodotto trovato</p>
            </div>
        </div>
    </main>

    <!-- Modal for viewing enlarged line image -->
    <div id="image-modal"
